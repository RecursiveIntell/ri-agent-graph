[package]
name = "agent-graph-mcp"
version = "0.2.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "MCP server exposing agent-graph + llm-pipeline for graph-orchestrated LLM workflows — typed rmcp tools, parallel fan-out, interrupt/resume, durable persistence"
repository = "https://github.com/RecursiveIntell/ri-agent-graph"
homepage = "https://github.com/RecursiveIntell/ri-agent-graph"
documentation = "https://docs.rs/agent-graph-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "graph", "workflow", "orchestration"]
categories = ["development-tools", "asynchronous"]
include = ["src/", "tests/", "README.md", "LICENSE-MIT", "assets/"]

[dependencies]
ri-agent-graph = { version = "0.2.1", path = "../agent-graph" }
llm-pipeline = "0.2"
async-trait = "0.1"
rmcp = { version = "1", features = ["server", "transport-io"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
libc = "0.2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
