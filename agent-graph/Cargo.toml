[package]
name = "ri-agent-graph"
version = "0.2.4"
edition = "2021"
description = "Run 9 agents at once — graph-based agent orchestration for Rust with parallel fan-out (up to 16 nodes), fan-in joins, checkpointing, interrupt/resume, and event streaming"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RecursiveIntell/ri-agent-graph"
homepage = "https://github.com/RecursiveIntell/ri-agent-graph"
documentation = "https://docs.rs/ri-agent-graph"
keywords = ["ai", "llm", "agents", "graph", "workflow"]
categories = ["algorithms", "asynchronous"]
include = ["src/", "tests/", "examples/", "benches/", "README.md", "LICENSE-MIT", "assets/"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Database (for checkpointing)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for execution IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"

# Shared identity/trace primitives
stack-ids = "0.1"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[features]
default = ["checkpointing"]
checkpointing = ["rusqlite"]

[[bench]]
name = "graph_bench"
harness = false

[lints]
workspace = true
